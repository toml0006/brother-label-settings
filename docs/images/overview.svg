<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">A USB label printer on Wi-Fi through a Raspberry Pi</title>
  <desc id="d">Phones, tablets and computers print over Wi-Fi to a Raspberry Pi, which is connected by USB to a Brother QL label printer.</desc>
  <rect x="1" y="1" width="878" height="248" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- your devices -->
  <g fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="62" y="70" width="44" height="78" rx="7"/>
    <line x1="78" y1="138" x2="90" y2="138"/>
    <rect x="124" y="82" width="92" height="56" rx="5"/>
    <line x1="112" y1="148" x2="228" y2="148"/>
  </g>
  <text x="145" y="186" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Your devices</text>
  <text x="145" y="208" text-anchor="middle" font-size="13.5" fill="#59636e">AirPrint or network printer</text>

  <!-- Wi-Fi link -->
  <g fill="none" stroke="#0969da" stroke-width="2.5" stroke-linecap="round">
    <line x1="250" y1="110" x2="352" y2="110" stroke-dasharray="2 9"/>
    <path d="M287 94 a20 20 0 0 1 28 0"/>
    <path d="M293 101 a11 11 0 0 1 16 0"/>
  </g>
  <text x="301" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0969da">Wi-Fi</text>

  <!-- Raspberry Pi -->
  <g fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round">
    <rect x="372" y="78" width="136" height="64" rx="8"/>
    <rect x="388" y="94" width="34" height="32" rx="3"/>
    <rect x="484" y="96" width="24" height="28" rx="2" fill="#ffffff"/>
  </g>
  <g fill="#1f2328">
    <circle cx="438" cy="92" r="2.2"/><circle cx="448" cy="92" r="2.2"/><circle cx="458" cy="92" r="2.2"/><circle cx="468" cy="92" r="2.2"/>
  </g>
  <text x="440" y="186" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Raspberry Pi</text>
  <text x="440" y="208" text-anchor="middle" font-size="13.5" fill="#59636e">print server and web page</text>

  <!-- USB link -->
  <line x1="510" y1="110" x2="640" y2="110" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/>
  <text x="575" y="134" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">USB</text>

  <!-- label printer -->
  <g fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="660" y="84" width="150" height="64" rx="10"/>
    <path d="M690 84 v-36 h90 v36" fill="#ffffff"/>
    <line x1="704" y1="62" x2="766" y2="62"/>
    <line x1="704" y1="73" x2="748" y2="73"/>
    <line x1="682" y1="130" x2="788" y2="130"/>
  </g>
  <text x="735" y="186" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Brother QL label printer</text>
  <text x="735" y="208" text-anchor="middle" font-size="13.5" fill="#59636e">USB only, now on your network</text>
</svg>
